{% extends "base.html" %}

{% block title %}Modifier une Salle{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header">
        <h2>✏️ Modifier la Salle : {{ salle.nom }}</h2>
        <div class="page-actions">
            <a href="{{ url_for('liste_salles') }}" class="bouton bouton-secondaire">
                ← Retour à la liste
            </a>
        </div>
    </div>

    <form method="POST" action="{{ url_for('modifier_salle', salle_id=salle.id) }}" class="form">
        <div class="form-group">
            <label for="nom">Nom de la salle <span class="required">*</span></label>
            <input type="text" 
                   id="nom" 
                   name="nom" 
                   placeholder="Ex: Amphi A" 
                   value="{{ salle.nom }}" 
                   required>
            <span class="form-hint">Modifiez le nom de la salle.</span>
        </div>

        <div class="form-group">
            <label for="capacite">Capacité <span class="required">*</span></label>
            <input type="number" 
                   id="capacite" 
                   name="capacite" 
                   placeholder="Ex: 50" 
                   min="1" 
                   step="1" 
                   value="{{ salle.capacite }}" 
                   required>
            <span class="form-hint">Modifiez la capacité maximale de la salle.</span>
        </div>

        <div class="form-actions">
            <button type="submit" class="bouton bouton-primaire">
                ✅ Enregistrer les modifications
            </button>
            <a href="{{ url_for('liste_salles') }}" class="bouton bouton-annuler">
                Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}
